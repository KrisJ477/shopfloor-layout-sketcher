<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101215">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Shopfloor Layout Sketcher</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#101215; --panel:#191c21; --line:#262b32;
    --ink:#e9ecf0; --dim:#8b929c; --faint:#5b626b;
    --accent:#ffc400; --good:#17c964; --bad:#ff3b30; --cool:#6fb4ff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { overscroll-behavior:none; }
  body {
    margin:0; height:100dvh; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
    padding:max(.4rem,env(safe-area-inset-top)) .55rem max(.4rem,env(safe-area-inset-bottom));
    gap:.4rem; user-select:none; -webkit-user-select:none; touch-action:none;
  }

  /* ---------------- header ---------------- */
  header { display:flex; align-items:center; gap:.4rem; flex:0 0 auto; }
  .iconbtn {
    flex:0 0 auto; width:2.3rem; height:2.3rem; border:0; border-radius:.5rem;
    background:var(--panel); color:var(--ink); font-size:1.1rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active { background:#232830; }
  #title {
    flex:1; min-width:0; font-size:.85rem; font-weight:800;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #title small { display:block; font-size:.6rem; font-weight:600; color:var(--dim); }

  /* ---------------- canvas ---------------- */
  #wrap { flex:1 1 auto; position:relative; min-height:0;
          border:1px solid var(--line); border-radius:.9rem; overflow:hidden;
          background:#0b0d10; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #hint {
    position:absolute; left:50%; bottom:.5rem; transform:translateX(-50%);
    font-size:.65rem; color:var(--faint); pointer-events:none; white-space:nowrap;
    max-width:96%; overflow:hidden; text-overflow:ellipsis;
  }
  #editbar {
    position:absolute; top:.5rem; left:50%; transform:translateX(-50%);
    display:none; align-items:center; gap:.35rem; z-index:5;
    background:rgba(25,28,33,.94); border:1px solid var(--line);
    border-radius:.6rem; padding:.3rem .35rem;
  }
  #editbar.show { display:flex; }
  #editbar .seg {
    border:1px solid var(--line); border-radius:.45rem; padding:.4rem .6rem;
    font:inherit; font-size:.7rem; font-weight:800; letter-spacing:.04em;
    background:var(--bg); color:var(--dim);
  }
  #editbar .seg.on { background:#2b2213; color:var(--accent); border-color:#5a4a17; }
  #editbar .done {
    border:0; border-radius:.45rem; padding:.42rem .7rem;
    font:inherit; font-size:.7rem; font-weight:800; letter-spacing:.05em;
    background:#0f2b1a; color:var(--good);
  }

  /* ---------------- selection panel ---------------- */
  #panel {
    flex:0 0 auto; background:var(--panel); border:1px solid var(--line);
    border-radius:.6rem; padding:.45rem .55rem;
    display:none; flex-direction:column; gap:.4rem;
  }
  #panel.show { display:flex; }
  .row { display:flex; align-items:center; gap:.4rem; }
  .row label { font-size:.6rem; font-weight:700; color:var(--dim); letter-spacing:.05em; }
  .row input[type=text] {
    flex:1; min-width:0; font:inherit; font-size:.85rem; font-weight:700;
    background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:.45rem; padding:.4rem .5rem;
  }
  .row input[type=number] {
    width:4.6rem; font:inherit; font-size:.85rem; font-weight:700;
    background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:.45rem; padding:.4rem .4rem; text-align:right;
  }
  .row input[type=color] {
    width:2.3rem; height:2.1rem; border:1px solid var(--line);
    border-radius:.45rem; background:var(--bg); padding:.15rem;
  }
  .btn {
    border:0; border-radius:.45rem; padding:.5rem .6rem;
    font:inherit; font-size:.7rem; font-weight:800; letter-spacing:.05em;
    background:#232830; color:var(--ink);
  }
  .btn:active { background:#2c333d; }
  .btn.warn { background:#2a0d0f; color:var(--bad); }
  .btn.acc  { background:#2b2213; color:var(--accent); }

  /* ---------------- sheet dialogs ---------------- */
  #shade {
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:none; align-items:flex-end; z-index:10;
  }
  #shade.show { display:flex; }
  .sheet {
    width:100%; background:var(--panel); border-top:1px solid var(--line);
    border-radius:1rem 1rem 0 0; padding:.8rem .8rem max(.8rem,env(safe-area-inset-bottom));
    display:none; flex-direction:column; gap:.5rem; max-height:75dvh; overflow-y:auto;
  }
  .sheet.show { display:flex; }
  .sheet h2 { margin:0 0 .2rem; font-size:.8rem; letter-spacing:.06em; color:var(--accent); }
  .preset {
    display:flex; align-items:center; gap:.5rem; border:1px solid var(--line);
    border-radius:.55rem; padding:.55rem .6rem; background:var(--bg);
    font:inherit; color:var(--ink); text-align:left;
  }
  .preset:active { background:#171a1f; }
  .preset .sw { width:1rem; height:1rem; border-radius:.25rem; flex:0 0 auto; }
  .preset b { font-size:.8rem; }
  .preset small { margin-left:auto; color:var(--dim); font-size:.65rem; white-space:nowrap; }
  select {
    font:inherit; font-size:.85rem; font-weight:700;
    background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:.45rem; padding:.45rem .5rem;
  }
  input[type=checkbox] { width:1.2rem; height:1.2rem; accent-color:var(--accent); }
</style>
</head>
<body>

<header>
  <button class="iconbtn" id="btnAdd" title="Add item">＋</button>
  <div id="title">Shopfloor Layout Sketcher<small id="floorInfo"></small></div>
  <button class="iconbtn" id="btnFloor" title="Floor settings">📐</button>
  <button class="iconbtn" id="btnMenu" title="Export / import">⋯</button>
</header>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="editbar">
    <button class="seg" id="ebRect">▭ RECT</button>
    <button class="seg" id="ebCirc">◯ CIRCLE</button>
    <button class="done" id="ebDone">✓ DONE</button>
  </div>
  <div id="hint"></div>
</div>

<div id="panel">
  <div class="row">
    <input type="text" id="pName" placeholder="Name">
    <input type="color" id="pColor">
  </div>
  <div class="row" id="rowOv">
    <label id="pWLabel">W</label><input type="number" id="pW" min="0.01" step="any">
    <span id="pDWrap"><label>D</label> <input type="number" id="pD" min="0.01" step="any"></span>
    <span style="flex:1"></span>
    <button class="btn" id="pRot">⟳ 45°</button>
    <button class="btn" id="pDup">DUP</button>
    <button class="btn warn" id="pDel">DEL</button>
  </div>
  <div class="row" id="rowEdit" style="display:none">
    <label id="epLabel">CORE</label>
    <input type="number" id="eA" min="0" step="any">
    <input type="number" id="eB" min="0" step="any">
    <span style="flex:1;font-size:.6rem;color:var(--dim)" id="epHint"></span>
  </div>
</div>

<div id="shade">
  <div class="sheet" id="sheetAdd">
    <h2>ADD ITEM</h2>
    <div id="presetList"></div>
  </div>
  <div class="sheet" id="sheetFloor">
    <h2>FLOOR</h2>
    <div class="row">
      <label>UNIT</label>
      <select id="fUnit">
        <option value="m">meters</option>
        <option value="cm">centimeters</option>
        <option value="ft">feet</option>
        <option value="in">inches</option>
      </select>
    </div>
    <div class="row">
      <label>W</label><input type="number" id="fW" min="1" step="any">
      <label>D</label><input type="number" id="fD" min="1" step="any">
    </div>
    <div class="row">
      <label>SNAP</label><input type="number" id="fGrid" min="0" step="any">
      <span style="font-size:.6rem;color:var(--dim)">0 = no snap</span>
    </div>
    <div class="row">
      <label>PLAN</label><input type="checkbox" id="fBg">
      <span style="font-size:.6rem;color:var(--dim)">show Vån 1 background (bold grid = 6×6 m)</span>
    </div>
    <div class="row">
      <button class="btn acc" id="fApply" style="flex:1">APPLY</button>
      <button class="btn" id="fFit">FIT VIEW</button>
    </div>
  </div>
  <div class="sheet" id="sheetMenu">
    <h2>LAYOUT</h2>
    <button class="preset" id="mPng"><b>Export PNG</b><small>image snapshot</small></button>
    <button class="preset" id="mJson"><b>Export JSON</b><small>backup file</small></button>
    <button class="preset" id="mImport"><b>Import JSON</b><small>restore backup</small></button>
    <button class="preset" id="mClear"><b style="color:var(--bad)">Clear layout</b><small>remove all items</small></button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</div>

<script>
"use strict";
/* ============ units (internal unit: cm) ============ */
const UNITS = { m:100, cm:1, ft:30.48, in:2.54 };
const toCm   = (v,u)=>v*UNITS[u];
const fromCm = (v,u)=>v/UNITS[u];
const fmt = v => (Math.round(v*100)/100).toString();
const RAD = Math.PI/180;

/* ============ background plan (Vån 1, bold grid squares = 6 m) ============ */
// 540×807 px @ 5.6845 cm/px (major grid lines 105.55 px apart = 6 m;
// sanity-checked: doors ≈ 0.97 m, toilets ≈ 0.68 m, stair treads ≈ 28 cm)
const BG = { src:"./floorplan.png", w:3070, d:4587 };
const bgImg = new Image();
bgImg.src = BG.src;
bgImg.onload = ()=>draw();

/* ============ state ============ */
const KEY  = "sfls-state-v2";
const KEY1 = "sfls-state-v1";
let S = {
  unit:"m",
  floor:{ w:BG.w, d:BG.d },     // cm
  grid:25,                      // move-snap in cm, 0 = off
  bg:true,
  items:[]
};
/* item: {id,name,color,shape:"rect"|"circle",x,y,rot,w,d,clr:{t,r,b,l},clrR}
   x,y = center (cm); rot in degrees; circle: w=d=diameter;
   clr = per-side clearance depth (rect, cm); clrR = extra clearance radius (circle, cm) */
function normItem(it) {
  return {
    id: it.id ?? (Date.now()+Math.random()),
    name: it.name || "Item",
    color: it.color || "#6fb4ff",
    shape: it.shape === "circle" ? "circle" : "rect",
    x: +it.x || 0, y: +it.y || 0,
    rot: ((Math.round((+it.rot || 0)/45)*45) % 360 + 360) % 360,
    w: Math.max(1, +it.w || 100),
    d: Math.max(1, +it.d || 100),
    clr: { t:Math.max(0,+(it.clr?.t)||0), r:Math.max(0,+(it.clr?.r)||0),
           b:Math.max(0,+(it.clr?.b)||0), l:Math.max(0,+(it.clr?.l)||0) },
    clrR: Math.max(0, +it.clrR || 0),
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.floor && Array.isArray(p.items)) {
        S = { unit:p.unit||"m", floor:p.floor, grid:+p.grid||0,
              bg:p.bg!==false, items:p.items.map(normItem) };
        // layouts saved against the mis-scaled plan (fine grid taken as 3 m
        // instead of 1.2 m): fix the floor and keep items on the same spot
        if (Math.round(S.floor.w) === 7675 && Math.round(S.floor.d) === 11470) {
          const k = BG.w/7675;
          S.floor = { w:BG.w, d:BG.d };
          for (const it of S.items) { it.x *= k; it.y *= k; }
        }
        return;
      }
    }
    const raw1 = localStorage.getItem(KEY1);      // migrate old layouts onto the plan
    if (raw1) {
      const p = JSON.parse(raw1);
      if (p && Array.isArray(p.items)) {
        S.unit = p.unit || "m";
        S.grid = +p.grid || 25;
        S.items = p.items.map(normItem);
      }
    }
  } catch (e) {}
}
loadState();
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }, 250);
}

/* ============ view transform ============ */
const wrap = document.getElementById("wrap");
const cv   = document.getElementById("cv");
const ctx  = cv.getContext("2d");
let view = { scale:0.5, x:0, y:0 };   // px per cm, px offset of floor origin
let dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(wrap.clientWidth  * dpr);
  cv.height = Math.round(wrap.clientHeight * dpr);
  draw();
}
function fitView() {
  const pad = 24;
  const sx = (wrap.clientWidth  - pad*2) / S.floor.w;
  const sy = (wrap.clientHeight - pad*2) / S.floor.d;
  view.scale = Math.max(0.02, Math.min(sx, sy));
  view.x = (wrap.clientWidth  - S.floor.w*view.scale)/2;
  view.y = (wrap.clientHeight - S.floor.d*view.scale)/2;
  draw();
}
const px = (cx,cy)=>[view.x + cx*view.scale, view.y + cy*view.scale];
const cm = (x,y)=>[(x - view.x)/view.scale, (y - view.y)/view.scale];

/* ============ geometry ============ */
let selId  = null;                 // selected item (overview)
let editId = null;                 // item in edit mode, null = overview
let editPart = "core";             // core | t | r | b | l | ring
const sel = ()=>S.items.find(i=>i.id===selId) || null;
const editItem = ()=>S.items.find(i=>i.id===editId) || null;
const editing = ()=>!!editItem();

function toLocal(x0, y0, rot, cxp, cyp) {   // world cm -> item-local cm
  const a = -rot*RAD, dx = cxp-x0, dy = cyp-y0;
  return [dx*Math.cos(a)-dy*Math.sin(a), dx*Math.sin(a)+dy*Math.cos(a)];
}
function toWorld(x0, y0, rot, lx, ly) {
  const a = rot*RAD;
  return [x0 + lx*Math.cos(a)-ly*Math.sin(a), y0 + lx*Math.sin(a)+ly*Math.cos(a)];
}
function partAt(it, cxp, cyp) {    // which body part is under a world point
  const [lx,ly] = toLocal(it.x, it.y, it.rot, cxp, cyp);
  if (it.shape === "circle") {
    const rr = Math.hypot(lx,ly), r = it.w/2;
    if (rr <= r) return "core";
    if (rr <= r + it.clrR) return "ring";
    return null;
  }
  const w2 = it.w/2, d2 = it.d/2, c = it.clr;
  if (Math.abs(lx) <= w2 && Math.abs(ly) <= d2) return "core";
  if (Math.abs(lx) <= w2 && ly < -d2 && ly >= -d2 - c.t) return "t";
  if (Math.abs(lx) <= w2 && ly >  d2 && ly <=  d2 + c.b) return "b";
  if (Math.abs(ly) <= d2 && lx < -w2 && lx >= -w2 - c.l) return "l";
  if (Math.abs(ly) <= d2 && lx >  w2 && lx <=  w2 + c.r) return "r";
  return null;
}
function hit(cxp, cyp) {           // topmost item: cores first, then clearance zones
  for (let i = S.items.length-1; i >= 0; i--)
    if (partAt(S.items[i], cxp, cyp) === "core") return S.items[i];
  for (let i = S.items.length-1; i >= 0; i--)
    if (partAt(S.items[i], cxp, cyp)) return S.items[i];
  return null;
}
function outerRadius(it) {         // cm, item center to farthest clearance corner
  if (it.shape === "circle") return it.w/2 + it.clrR;
  const c = it.clr;
  return Math.hypot(it.w/2 + Math.max(c.l,c.r), it.d/2 + Math.max(c.t,c.b));
}
function snap(v) { return S.grid > 0 ? Math.round(v/S.grid)*S.grid : v; }

/* ============ gizmo & handles ============ */
function gizmoRadius(it) { return Math.max(44, outerRadius(it)*view.scale + 26); }  // px
function knobPos(it) {
  const R = gizmoRadius(it), a = (it.rot-90)*RAD;
  const [sx,sy] = px(it.x, it.y);
  return [sx + Math.cos(a)*R, sy + Math.sin(a)*R];
}
function editHandles(it) {         // local-cm handle positions for edit mode
  if (it.shape === "circle") {
    const r = it.w/2, R = r + it.clrR, k = Math.SQRT1_2;
    return [
      { part:"core", x:r,   y:0,    kind:"core" },
      { part:"ring", x:R*k, y:-R*k, kind:"clr"  },
    ];
  }
  const w2 = it.w/2, d2 = it.d/2, c = it.clr;
  return [
    { part:"coreL", x:-w2, y:0,   kind:"core" },
    { part:"coreR", x: w2, y:0,   kind:"core" },
    { part:"coreT", x:0,   y:-d2, kind:"core" },
    { part:"coreB", x:0,   y: d2, kind:"core" },
    { part:"t", x:-w2/2,    y:-d2-c.t, kind:"clr" },
    { part:"b", x:-w2/2,    y: d2+c.b, kind:"clr" },
    { part:"l", x:-w2-c.l,  y:-d2/2,  kind:"clr" },
    { part:"r", x: w2+c.r,  y:-d2/2,  kind:"clr" },
  ];
}
const partOf = h => h.startsWith("core") ? "core" : h;   // handle id -> panel part
function handleAtScreen(it, sx, sy) {
  for (const h of editHandles(it)) {
    const [wx,wy] = toWorld(it.x, it.y, it.rot, h.x, h.y);
    const [hx,hy] = px(wx,wy);
    if (Math.hypot(sx-hx, sy-hy) < 22) return h;
  }
  return null;
}
function applyHandleDrag(h, cxp, cyp) {
  const it = h.it, MIN = 10;
  const [lx,ly] = toLocal(h.x0, h.y0, it.rot, cxp, cyp);
  const setCenter = (sx,sy)=>{ [it.x,it.y] = toWorld(h.x0, h.y0, it.rot, sx, sy); };
  const pos = v => Math.max(0, Math.round(v));
  if (it.shape === "circle") {
    if (h.part === "core") { const r = Math.max(MIN/2, Math.hypot(lx,ly)); it.w = it.d = Math.round(r*2); }
    else                   { it.clrR = pos(Math.hypot(lx,ly) - it.w/2); }
    return;
  }
  switch (h.part) {
    case "coreR": { const l=-h.w0/2, r=Math.max(lx, l+MIN); it.w=Math.round(r-l); setCenter((r+l)/2, 0); break; }
    case "coreL": { const r= h.w0/2, l=Math.min(lx, r-MIN); it.w=Math.round(r-l); setCenter((r+l)/2, 0); break; }
    case "coreB": { const t=-h.d0/2, b=Math.max(ly, t+MIN); it.d=Math.round(b-t); setCenter(0, (b+t)/2); break; }
    case "coreT": { const b= h.d0/2, t=Math.min(ly, b-MIN); it.d=Math.round(b-t); setCenter(0, (b+t)/2); break; }
    case "t": it.clr.t = pos(-ly - it.d/2); break;
    case "b": it.clr.b = pos( ly - it.d/2); break;
    case "l": it.clr.l = pos(-lx - it.w/2); break;
    case "r": it.clr.r = pos( lx - it.w/2); break;
  }
}

/* ============ drawing ============ */
const CLR_FILL = "rgba(111,180,255,0.16)", CLR_LINE = "rgba(111,180,255,0.55)";
function drawItem(g, it, scale, P, opts) {
  const { selected=false, dimmed=false, edit=false } = opts || {};
  const [cx,cy] = P(it.x, it.y);
  g.save();
  if (dimmed) g.globalAlpha = 0.25;
  g.translate(cx, cy);
  g.rotate(it.rot*RAD);

  const hl = part => edit && editPart === part;
  const hlStroke = ()=>{ g.strokeStyle = "#ffc400"; g.lineWidth = 2.5; g.setLineDash([6,4]); };

  if (it.shape === "circle") {
    const r = it.w/2*scale, R = (it.w/2 + it.clrR)*scale;
    if (it.clrR > 0 || edit) {
      g.beginPath(); g.arc(0,0,R,0,Math.PI*2);
      g.fillStyle = CLR_FILL; g.fill();
      g.strokeStyle = CLR_LINE; g.lineWidth = 1; g.setLineDash([5,4]); g.stroke(); g.setLineDash([]);
      if (hl("ring")) { g.beginPath(); g.arc(0,0,R,0,Math.PI*2); hlStroke(); g.stroke(); g.setLineDash([]); }
    }
    g.beginPath(); g.arc(0,0,r,0,Math.PI*2);
    g.fillStyle = it.color + "66"; g.fill();
    g.strokeStyle = it.color; g.lineWidth = selected ? 3 : 1.5; g.stroke();
    if (hl("core")) { g.beginPath(); g.arc(0,0,r,0,Math.PI*2); hlStroke(); g.stroke(); g.setLineDash([]); }
  } else {
    const w = it.w*scale, h = it.d*scale, c = it.clr;
    const zones = { t:[-w/2, -h/2 - c.t*scale, w, c.t*scale],
                    b:[-w/2,  h/2,             w, c.b*scale],
                    l:[-w/2 - c.l*scale, -h/2, c.l*scale, h],
                    r:[ w/2,             -h/2, c.r*scale, h] };
    for (const k in zones) {
      const z = zones[k];
      if (z[2] < 0.5 || z[3] < 0.5) { if (hl(k)) { hlStroke(); g.strokeRect(...z); g.setLineDash([]); } continue; }
      g.fillStyle = CLR_FILL; g.fillRect(...z);
      g.strokeStyle = CLR_LINE; g.lineWidth = 1; g.setLineDash([5,4]); g.strokeRect(...z); g.setLineDash([]);
      if (hl(k)) { hlStroke(); g.strokeRect(...z); g.setLineDash([]); }
    }
    g.fillStyle = it.color + "66";
    g.strokeStyle = it.color; g.lineWidth = selected ? 3 : 1.5;
    g.fillRect(-w/2, -h/2, w, h); g.strokeRect(-w/2, -h/2, w, h);
    if (hl("core")) { hlStroke(); g.strokeRect(-w/2, -h/2, w, h); g.setLineDash([]); }
  }

  // label (kept horizontal)
  const iw = it.w*scale, ih = it.d*scale;
  if (iw > 24 && ih > 14) {
    g.rotate(-it.rot*RAD);
    const fs = Math.max(9, Math.min(15, iw/6));
    g.fillStyle = dimmed ? "#8b929c" : "#e9ecf0";
    g.font = `700 ${fs}px -apple-system,'Segoe UI',Roboto,sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(it.name, 0, 0, Math.max(iw,ih)-6);
    if (Math.min(iw,ih) > fs*3) {
      g.fillStyle = "#8b929c"; g.font = `600 ${fs*0.75}px -apple-system,'Segoe UI',Roboto,sans-serif`;
      const dims = it.shape === "circle"
        ? `Ø ${fmt(fromCm(it.w,S.unit))}`
        : `${fmt(fromCm(it.w,S.unit))}×${fmt(fromCm(it.d,S.unit))}`;
      g.fillText(dims, 0, fs, Math.max(iw,ih)-6);
    }
  }
  g.restore();
}
function drawScene(g, scale, ox, oy, w, h, ui) {
  g.fillStyle = "#0b0d10"; g.fillRect(0,0,w,h);
  const P = (x,y)=>[ox + x*scale, oy + y*scale];

  // floor + background plan
  const [fx,fy] = P(0,0);
  const fw = S.floor.w*scale, fh = S.floor.d*scale;
  g.fillStyle = "#14171c"; g.fillRect(fx,fy,fw,fh);
  if (S.bg && bgImg.complete && bgImg.naturalWidth) {
    g.imageSmoothingEnabled = true;
    g.drawImage(bgImg, fx, fy, BG.w*scale, BG.d*scale);
  }

  // snap grid
  if (S.grid > 0 && S.grid*scale >= 6) {
    g.strokeStyle = "rgba(120,140,170,0.10)"; g.lineWidth = 1;
    g.beginPath();
    for (let x = S.grid; x < S.floor.w; x += S.grid) { const [a,b]=P(x,0); g.moveTo(a,b); g.lineTo(a,b+fh); }
    for (let y = S.grid; y < S.floor.d; y += S.grid) { const [a,b]=P(0,y); g.moveTo(a,b); g.lineTo(a+fw,b); }
    g.stroke();
  }
  g.strokeStyle = "#3a414b"; g.lineWidth = 2; g.strokeRect(fx,fy,fw,fh);

  // items
  const ed = ui ? editItem() : null;
  for (const it of S.items) {
    if (ed && it.id === ed.id) continue;
    drawItem(g, it, scale, P, { selected: ui && !ed && it.id === selId, dimmed: !!ed });
  }
  if (ed) drawItem(g, ed, scale, P, { edit:true });
  if (!ui) return;

  if (ed) drawEditUI(g, ed);
  else if (sel()) drawGizmo(g, sel());
}
function drawGizmo(g, it) {
  const [cx,cy] = px(it.x, it.y);
  const R = gizmoRadius(it);
  g.save();
  g.strokeStyle = "rgba(255,196,0,0.45)"; g.lineWidth = 1.5;
  g.setLineDash([6,5]);
  g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2); g.stroke();
  g.setLineDash([]);
  // 45° ticks
  g.strokeStyle = "rgba(255,196,0,0.35)";
  for (let a = 0; a < 360; a += 45) {
    const r1 = R-4, r2 = R+4, ca = Math.cos((a-90)*RAD), sa = Math.sin((a-90)*RAD);
    g.beginPath(); g.moveTo(cx+ca*r1, cy+sa*r1); g.lineTo(cx+ca*r2, cy+sa*r2); g.stroke();
  }
  // rotate knob
  const [kx,ky] = knobPos(it);
  g.beginPath(); g.moveTo(cx,cy); g.lineTo(kx,ky);
  g.strokeStyle = "rgba(255,196,0,0.5)"; g.stroke();
  g.beginPath(); g.arc(kx,ky,13,0,Math.PI*2);
  g.fillStyle = "#ffc400"; g.fill();
  g.strokeStyle = "#101215"; g.lineWidth = 2; g.stroke();
  // arrow glyph on knob
  g.beginPath(); g.arc(kx,ky,6.5,-2.4,1.6);
  g.strokeStyle = "#101215"; g.lineWidth = 2; g.stroke();
  const tx = kx + Math.cos(1.6)*6.5, ty = ky + Math.sin(1.6)*6.5;
  g.beginPath(); g.moveTo(tx-4,ty-1); g.lineTo(tx+2,ty+4); g.lineTo(tx+3,ty-4);
  g.fillStyle = "#101215"; g.fill();
  // angle badge
  g.font = "700 12px -apple-system,'Segoe UI',Roboto,sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#ffc400";
  g.fillText(it.rot + "°", kx, ky - 24);
  g.restore();
}
function drawEditUI(g, it) {
  g.save();
  for (const h of editHandles(it)) {
    const [wx,wy] = toWorld(it.x, it.y, it.rot, h.x, h.y);
    const [hx,hy] = px(wx,wy);
    const active = partOf(h.part) === editPart;
    const r = active ? 9 : 7;
    if (h.kind === "core") {
      g.fillStyle = "#ffc400"; g.strokeStyle = "#101215"; g.lineWidth = 2;
      g.fillRect(hx-r, hy-r, r*2, r*2); g.strokeRect(hx-r, hy-r, r*2, r*2);
    } else {
      g.beginPath(); g.arc(hx,hy,r+1,0,Math.PI*2);
      g.fillStyle = "#101215"; g.fill();
      g.strokeStyle = "#6fb4ff"; g.lineWidth = active ? 3 : 2; g.stroke();
    }
  }
  g.restore();
}
function draw() {
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawScene(ctx, view.scale, view.x, view.y, wrap.clientWidth, wrap.clientHeight, true);
}

/* ============ pointers: tap / drag / rotate / handles / pan / pinch ============ */
const ptrs = new Map();
let drag  = null;   // {it,dx,dy}          move selected item (overview)
let pan   = null;   // {x,y,vx,vy}         pan view
let pinch = null;   // {dist,scale,mx,my,vx,vy}
let rotG  = null;   // {it}                rotate-gizmo drag
let hdl   = null;   // {it,part,w0,d0,x0,y0} edit-handle drag
let moved = false;
let lastTap = null; // {t,x,y,id}          double-tap detection

cv.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  cv.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId, { x:ev.offsetX, y:ev.offsetY });
  moved = false;
  if (ptrs.size === 2) {
    if (drag || hdl || rotG) save();
    drag = pan = rotG = hdl = null;
    const [a,b] = [...ptrs.values()];
    pinch = { dist:Math.hypot(a.x-b.x,a.y-b.y), scale:view.scale,
              mx:(a.x+b.x)/2, my:(a.y+b.y)/2, vx:view.x, vy:view.y };
    return;
  }
  const sx = ev.offsetX, sy = ev.offsetY;
  const [cxp,cyp] = cm(sx,sy);

  if (editing()) {
    const it = editItem();
    const h = handleAtScreen(it, sx, sy);
    if (h) {
      hdl = { it, part:h.part, w0:it.w, d0:it.d, x0:it.x, y0:it.y };
      setEditPart(partOf(h.part));
      return;
    }
    if (partAt(it, cxp, cyp)) return;           // tap on body: part select on pointerup
    pan = { x:sx, y:sy, vx:view.x, vy:view.y };
    return;
  }

  const s = sel();
  if (s) {
    const [kx,ky] = knobPos(s);
    if (Math.hypot(sx-kx, sy-ky) < 26) { rotG = { it:s }; return; }
  }
  const it = hit(cxp,cyp);
  if (it && it.id === selId) drag = { it, dx:it.x-cxp, dy:it.y-cyp };
  else pan = { x:sx, y:sy, vx:view.x, vy:view.y };
});

cv.addEventListener("pointermove", ev => {
  if (!ptrs.has(ev.pointerId)) return;
  const p = ptrs.get(ev.pointerId);
  if (Math.hypot(ev.offsetX-p.x, ev.offsetY-p.y) > 4) moved = true;
  p.x = ev.offsetX; p.y = ev.offsetY;
  if (pinch && ptrs.size === 2) {
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const ns = Math.min(8, Math.max(0.02, pinch.scale * d/pinch.dist));
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    view.x = mx - (pinch.mx - pinch.vx) * (ns/pinch.scale);
    view.y = my - (pinch.my - pinch.vy) * (ns/pinch.scale);
    view.scale = ns;
    draw(); return;
  }
  if (rotG) {
    const [cx0,cy0] = px(rotG.it.x, rotG.it.y);
    const ang = Math.atan2(ev.offsetY-cy0, ev.offsetX-cx0)/RAD + 90;
    rotG.it.rot = ((Math.round(ang/45)*45) % 360 + 360) % 360;
    draw(); return;
  }
  if (hdl) {
    const [cxp,cyp] = cm(ev.offsetX, ev.offsetY);
    applyHandleDrag(hdl, cxp, cyp);
    syncEditInputs();
    draw(); return;
  }
  if (drag) {
    const [cxp,cyp] = cm(ev.offsetX, ev.offsetY);
    drag.it.x = snap(cxp + drag.dx);
    drag.it.y = snap(cyp + drag.dy);
    draw(); return;
  }
  if (pan) {
    view.x = pan.vx + (ev.offsetX - pan.x);
    view.y = pan.vy + (ev.offsetY - pan.y);
    draw();
  }
});

function handleTap(sx, sy) {
  const [cxp,cyp] = cm(sx,sy);
  const it = hit(cxp,cyp);
  const now = performance.now();
  const dbl = lastTap && (now - lastTap.t) < 400 &&
              Math.hypot(sx-lastTap.x, sy-lastTap.y) < 36 &&
              lastTap.id === (it ? it.id : null);
  lastTap = dbl ? null : { t:now, x:sx, y:sy, id: it ? it.id : null };

  if (editing()) {
    const ed = editItem();
    if (it && it.id === ed.id) {
      const part = partAt(ed, cxp, cyp);
      if (part) setEditPart(part);
    } else if (dbl) {
      exitEdit();
      if (it) enterEdit(it.id);
    }
    return;
  }
  if (dbl && it) { enterEdit(it.id); return; }
  select(it ? it.id : null);
}

function endPtr(ev) {
  if (!ptrs.has(ev.pointerId)) return;
  ptrs.delete(ev.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (rotG)      { rotG = null; save(); }
  else if (hdl)  { hdl = null;  save(); }
  else if (drag) { if (!moved) handleTap(ev.offsetX, ev.offsetY); else save(); drag = null; }
  else if (pan)  { if (!moved) handleTap(ev.offsetX, ev.offsetY); pan = null; }
  else if (!moved) handleTap(ev.offsetX, ev.offsetY);
  draw();
}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", ev => { ptrs.delete(ev.pointerId); if (ptrs.size<2) pinch=null; drag=pan=rotG=hdl=null; save(); draw(); });
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const k = ev.deltaY < 0 ? 1.12 : 1/1.12;
  const ns = Math.min(8, Math.max(0.02, view.scale*k));
  view.x = ev.offsetX - (ev.offsetX - view.x)*(ns/view.scale);
  view.y = ev.offsetY - (ev.offsetY - view.y)*(ns/view.scale);
  view.scale = ns; draw();
}, { passive:false });

/* ============ hints ============ */
const hint = document.getElementById("hint");
function updateHint() {
  if (editing()) hint.textContent = "tap a part to select it · drag handles to resize · ✓ DONE to finish";
  else if (sel()) hint.textContent = "drag body to move · drag knob to rotate (45°) · double-tap to edit";
  else hint.textContent = "tap item to select · double-tap to edit · drag/pinch to pan & zoom";
}

/* ============ selection panel (overview) ============ */
const panel = document.getElementById("panel");
const pName = document.getElementById("pName");
const pW = document.getElementById("pW"), pD = document.getElementById("pD");
const pWLabel = document.getElementById("pWLabel"), pDWrap = document.getElementById("pDWrap");
const pColor = document.getElementById("pColor");
const rowOv = document.getElementById("rowOv"), rowEdit = document.getElementById("rowEdit");

function select(id) {
  selId = id;
  const it = sel();
  panel.classList.toggle("show", !!it || editing());
  if (it) {
    pName.value = it.name;
    pColor.value = it.color;
    pWLabel.textContent = it.shape === "circle" ? "Ø" : "W";
    pDWrap.style.display = it.shape === "circle" ? "none" : "";
    pW.value = fmt(fromCm(it.w, S.unit));
    pD.value = fmt(fromCm(it.d, S.unit));
  }
  updateHint();
  draw();
}
pName.addEventListener("input", ()=>{ const it=editItem()||sel(); if(it){ it.name=pName.value; save(); draw(); }});
pColor.addEventListener("input", ()=>{ const it=editItem()||sel(); if(it){ it.color=pColor.value; save(); draw(); }});
function sizeInput() {
  const it = sel(); if (!it) return;
  const w = parseFloat(pW.value), d = parseFloat(pD.value);
  if (w > 0) it.w = toCm(w, S.unit);
  if (it.shape === "circle") it.d = it.w;
  else if (d > 0) it.d = toCm(d, S.unit);
  save(); draw();
}
pW.addEventListener("input", sizeInput);
pD.addEventListener("input", sizeInput);
document.getElementById("pRot").addEventListener("click", ()=>{
  const it = sel(); if (!it) return;
  it.rot = (it.rot + 45) % 360; save(); draw();
});
document.getElementById("pDup").addEventListener("click", ()=>{
  const it = sel(); if (!it) return;
  const off = outerRadius(it) + Math.max(S.grid, 30);
  const c = normItem({ ...it, clr:{...it.clr}, id:Date.now(), x:it.x + off, y:it.y });
  S.items.push(c); save(); select(c.id);
});
document.getElementById("pDel").addEventListener("click", ()=>{
  if (editing()) exitEdit();
  S.items = S.items.filter(i=>i.id!==selId); save(); select(null);
});

/* ============ edit mode ============ */
const editbar = document.getElementById("editbar");
const ebRect = document.getElementById("ebRect"), ebCirc = document.getElementById("ebCirc");
const epLabel = document.getElementById("epLabel"), epHint = document.getElementById("epHint");
const eA = document.getElementById("eA"), eB = document.getElementById("eB");
let prevView = null;

function enterEdit(id) {
  editId = id; editPart = "core";
  select(id);
  const it = editItem();
  prevView = { ...view };
  const target = Math.min(wrap.clientWidth, wrap.clientHeight) * 0.30;
  view.scale = Math.min(8, Math.max(view.scale, target / Math.max(outerRadius(it), 40)));
  view.x = wrap.clientWidth/2  - it.x*view.scale;
  view.y = wrap.clientHeight/2 - it.y*view.scale;
  editbar.classList.add("show");
  rowOv.style.display = "none";
  rowEdit.style.display = "";
  panel.classList.add("show");
  syncShapeButtons(); syncEditInputs(); updateHint(); draw();
}
function exitEdit() {
  const id = editId;
  editId = null;
  editbar.classList.remove("show");
  rowOv.style.display = "";
  rowEdit.style.display = "none";
  if (prevView) { view = prevView; prevView = null; }
  select(id);   // stays selected in overview, refreshes panel fields
}
function setEditPart(part) {
  editPart = part;
  syncEditInputs();
  draw();
}
function syncShapeButtons() {
  const it = editItem(); if (!it) return;
  ebRect.classList.toggle("on", it.shape === "rect");
  ebCirc.classList.toggle("on", it.shape === "circle");
}
const PART_LABEL = { core:"CORE", t:"CLEAR TOP", b:"CLEAR BOTTOM", l:"CLEAR LEFT", r:"CLEAR RIGHT", ring:"CLEAR RING" };
function syncEditInputs() {
  const it = editItem(); if (!it) return;
  epLabel.textContent = PART_LABEL[editPart] || "CORE";
  epHint.textContent = S.unit;
  if (editPart === "core") {
    if (it.shape === "circle") {
      eB.style.display = "none";
      eA.value = fmt(fromCm(it.w, S.unit));
    } else {
      eB.style.display = "";
      eA.value = fmt(fromCm(it.w, S.unit));
      eB.value = fmt(fromCm(it.d, S.unit));
    }
  } else {
    eB.style.display = "none";
    const v = editPart === "ring" ? it.clrR : it.clr[editPart];
    eA.value = fmt(fromCm(v, S.unit));
  }
}
function editInput() {
  const it = editItem(); if (!it) return;
  const a = parseFloat(eA.value), b = parseFloat(eB.value);
  if (editPart === "core") {
    if (a > 0) it.w = toCm(a, S.unit);
    if (it.shape === "circle") it.d = it.w;
    else if (b > 0) it.d = toCm(b, S.unit);
  } else if (editPart === "ring") {
    if (a >= 0) it.clrR = toCm(a, S.unit);
  } else if (a >= 0) {
    it.clr[editPart] = toCm(a, S.unit);
  }
  save(); draw();
}
eA.addEventListener("input", editInput);
eB.addEventListener("input", editInput);
ebRect.addEventListener("click", ()=>{
  const it = editItem(); if (!it || it.shape === "rect") return;
  it.shape = "rect"; it.d = it.w;
  editPart = "core";
  syncShapeButtons(); syncEditInputs(); save(); draw();
});
ebCirc.addEventListener("click", ()=>{
  const it = editItem(); if (!it || it.shape === "circle") return;
  it.shape = "circle"; it.w = it.d = Math.round((it.w + it.d)/2);
  editPart = "core";
  syncShapeButtons(); syncEditInputs(); save(); draw();
});
document.getElementById("ebDone").addEventListener("click", exitEdit);

document.addEventListener("keydown", ev => {
  if (ev.target && /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
  if (ev.key === "Escape") { if (editing()) exitEdit(); else select(null); }
  if ((ev.key === "Delete" || ev.key === "Backspace") && sel() && !editing()) {
    S.items = S.items.filter(i=>i.id!==selId); save(); select(null);
  }
});

function download(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

  oc.height = Math.round(S.floor.d*scale + pad*2);

  f.text().then(t => {
    const p = JSON.parse(t);
    if (!p || !Array.isArray(p.items)) throw new Error("bad file");
    S = { unit:p.unit||"m", floor:p.floor||{ w:BG.w, d:BG.d },
          grid:+p.grid||0, bg:p.bg!==false, items:p.items.map(normItem) };
    save(); floorInfo(); closeSheet();
    editId = null; editbar.classList.remove("show");
    rowOv.style.display = ""; rowEdit.style.display = "none";
    select(null); fitView();
  }).catch(()=>alert("Could not read that file."));
  fileIn.value = "";
});
document.getElementById("mClear").addEventListener("click", ()=>{
  if (confirm("Remove all items from the layout?")) {
    if (editing()) exitEdit();
    S.items = []; save(); select(null); closeSheet();
  }
});

/* ============ boot ============ */
window.addEventListener("resize", resize);
new ResizeObserver(resize).observe(wrap);
floorInfo(); updateHint(); resize(); fitView();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
